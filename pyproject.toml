[project]
name = "swarm-888-ops"
version = "0.1.0"
description = "Ansible tooling for installing the Swarm 888 operator"
requires-python = ">=3.12"
dependencies = ["ansible-core==2.20.11"]

[dependency-groups]
dev = ["ansible-lint==26.11.0", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
