[project]
name = "swarm-888"
version = "0.1.0"
description = "Local web operator with durable Codex workers and reusable Git catalogs"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.4"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
