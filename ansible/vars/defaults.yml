---
operator_user: swarm
operator_group: "{{ operator_user }}"
operator_home: "/home/{{ operator_user }}"
operator_checkout: "{{ operator_home }}/swarm-888"
operator_state_dir: "{{ operator_home }}/.local/share/vps-ai-operator"
operator_projects_dir: "{{ operator_home }}/packages"

# Clone only when absent. Source updates are an explicit owner operation.
operator_manage_checkout: true
operator_repo_url: https://github.com/karstenjakobsen/swarm-888.git
operator_repo_version: main
operator_rebuild: false

operator_node_version: "{{ lookup('ansible.builtin.file', playbook_dir + '/../.nvmrc') | trim }}"
operator_node_dir: "/opt/node-v{{ operator_node_version }}"
operator_node_arch: "{{ {'x86_64': 'x64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
operator_runtime_path: "{{ operator_checkout }}/node_modules/.bin:{{ operator_node_dir }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# Existing .env files are preserved unless replacement is explicitly requested.
operator_env_file: "{{ operator_checkout }}/.env"
operator_replace_env: false
operator_admin_password: ""
operator_host: 127.0.0.1
operator_port: 3001
operator_origins:
  - "http://localhost:{{ operator_port }}"
  - "http://127.0.0.1:{{ operator_port }}"
operator_secure_cookie: false
operator_improvement_enabled: true

operator_user_worker_enabled: true
operator_root_worker_enabled: true
operator_root_worker_id: root
operator_root_worker_name: Root worker
operator_root_worker_model: gpt-6.1-sol
operator_root_worker_effort: high
