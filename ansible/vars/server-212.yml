---
# Non-secret host configuration. The existing remote .env supplies credentials.
# Preview: uv run ansible-playbook ansible/setup.yml -i server-212, -e @ansible/vars/server-212.yml --check
operator_user: swarm
operator_group: swarm
operator_home: /home/swarm
operator_checkout: /home/swarm/swarm-888
operator_env_file: /home/swarm/swarm-888/.env
operator_state_dir: /home/swarm/.local/share/vps-ai-operator
operator_projects_dir: /home/swarm/packages

# Deploy the latest published main, preserving the private configuration and state.
operator_manage_checkout: true
operator_repo_url: https://github.com/karstenjakobsen/swarm-888.git
operator_repo_version: main
operator_replace_env: false
operator_rebuild: false

operator_node_version: 26.13.1
operator_node_dir: /opt/node-v26.13.1
operator_host: 127.0.0.1
operator_port: 3001
operator_origins:
  - https://swarm.karstenjakobsen.dk
operator_secure_cookie: true
operator_improvement_enabled: true

operator_user_worker_enabled: true
operator_root_worker_enabled: true
operator_root_worker_id: root
operator_root_worker_model: gpt-6.1-sol
operator_root_worker_effort: high

operator_github_ssh_known_hosts: true
operator_git_ssh_keys:
  - name: packages-888
    path: /home/swarm/.ssh/id_ed25519_packages_888
    repository_dir: /home/swarm/packages/repositories/909fd5b9-6395-4f72-900a-ce7af984ba1a
