---
# Called only after worker reservations and service shutdown. Fetch the exact
# planned commit, so a concurrent push to main cannot change this deployment.
- name: Fetch the pinned release commit
  ansible.builtin.command:
    argv:
      - git
      - -c
      - core.hooksPath=/dev/null
      - -C
      - "{{ operator_checkout }}"
      - fetch
      - --no-tags
      - --no-recurse-submodules
      - "{{ operator_repo_url }}"
      - "{{ operator_target_commit }}"
  become: true
  become_user: "{{ operator_user }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
  changed_when: false

- name: Recheck local source changes before checkout
  ansible.builtin.command:
    argv: [git, -c, core.fsmonitor=false, -C, "{{ operator_checkout }}", status, --porcelain, --untracked-files=all]
  become: true
  become_user: "{{ operator_user }}"
  changed_when: false
  register: operator_checkout_status

- name: Recheck the deployed commit before checkout
  ansible.builtin.command:
    argv: [git, -C, "{{ operator_checkout }}", rev-parse, HEAD]
  become: true
  become_user: "{{ operator_user }}"
  changed_when: false
  register: operator_checkout_revision

- name: Require an unchanged clean checkout
  ansible.builtin.assert:
    that:
      - operator_checkout_status.stdout | length == 0
      - operator_checkout_revision.stdout | trim == operator_current_commit
    fail_msg: Source changed during deployment. No checkout was attempted; review the local changes before retrying.

- name: Check that the release retains existing local history
  ansible.builtin.command:
    argv: [git, -C, "{{ operator_checkout }}", merge-base, --is-ancestor, "{{ operator_current_commit }}", "{{ operator_target_commit }}"]
  become: true
  become_user: "{{ operator_user }}"
  changed_when: false
  failed_when: false
  register: operator_source_ancestry

- name: Refuse to discard local commits or divergent history
  ansible.builtin.assert:
    that: operator_source_ancestry.rc == 0
    fail_msg: The requested release diverges from the deployed commit. Reconcile Git history before deploying; Ansible will not reset local commits.

- name: Check that the release does not track the private environment file
  ansible.builtin.command:
    argv: [git, -C, "{{ operator_checkout }}", ls-tree, --name-only, "{{ operator_target_commit }}", --, "{{ operator_env_file | relpath(operator_checkout) }}"]
  become: true
  become_user: "{{ operator_user }}"
  changed_when: false
  register: operator_release_env
  when: operator_env_file.startswith(operator_checkout + '/')

- name: Preserve the private environment file
  ansible.builtin.assert:
    that: operator_release_env.stdout | length == 0
    fail_msg: The requested source revision tracks the environment file. Remove it from Git before deploying.
  when: operator_env_file.startswith(operator_checkout + '/')

- name: Select the exact release commit without overwriting ignored files
  ansible.builtin.command:
    argv: [git, -c, core.hooksPath=/dev/null, -C, "{{ operator_checkout }}", checkout, --detach, --no-overwrite-ignore, "{{ operator_target_commit }}"]
  become: true
  become_user: "{{ operator_user }}"
  changed_when: true
