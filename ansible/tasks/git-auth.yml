---
- name: Validate Git identity locations
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-zA-Z0-9_-]+$')
      - item.path is match('^/[a-zA-Z0-9_./-]+$')
      - item.path.startswith(operator_home + '/.ssh/')
      - "'..' not in item.path.split('/')"
      - item.repository_dir is match('^/[a-zA-Z0-9_./-]+$')
      - "'..' not in item.repository_dir.split('/')"
    fail_msg: Use named SSH identities in the controller account's .ssh directory and canonical repository paths.
  loop: "{{ operator_git_ssh_keys }}"

- name: Resolve SSH identity paths before managing their ownership
  ansible.builtin.command:
    argv: [realpath, --canonicalize-missing, "{{ item.path }}"]
  loop: "{{ operator_git_ssh_keys }}"
  check_mode: false
  changed_when: false
  register: operator_git_identity_paths

- name: Require canonical SSH identity paths without symlinks
  ansible.builtin.assert:
    that: item.stdout | trim == item.item.path
    fail_msg: SSH identities and their parent directories must not use symlinks or path aliases.
  loop: "{{ operator_git_identity_paths.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Inspect existing private identities without reading their contents
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop: "{{ operator_git_ssh_keys }}"
  register: operator_git_private_identities

- name: Require existing private identities to be regular unshared files
  ansible.builtin.assert:
    that: >-
      not item.stat.exists or
      (item.stat.isreg | default(false) and item.stat.nlink | default(0) == 1)
    fail_msg: Existing SSH identities must be regular files with one hard link.
  loop: "{{ operator_git_private_identities.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Create the controller SSH directory
  ansible.builtin.file:
    path: "{{ operator_home }}/.ssh"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_group }}"
    mode: "0700"
    follow: false

- name: Generate missing package repository identities as the controller
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "swarm-888 {{ item.name }}", -f, "{{ item.path }}"]
    creates: "{{ item.path }}"
  become: true
  become_user: "{{ operator_user }}"
  loop: "{{ operator_git_ssh_keys }}"

- name: Keep private identities controller-owned and private
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ operator_user }}"
    group: "{{ operator_group }}"
    mode: "0600"
    follow: false
  loop: "{{ operator_git_ssh_keys }}"
  when: not ansible_check_mode

- name: Read GitHub's published SSH host keys over verified HTTPS
  ansible.builtin.uri:
    url: https://api.github.com/meta
    return_content: true
    status_code: 200
    headers:
      Accept: application/vnd.github+json
  register: operator_github_metadata
  check_mode: false
  when: operator_github_ssh_known_hosts | bool

- name: Trust GitHub's published host keys for controller Git operations
  ansible.builtin.known_hosts:
    path: "{{ operator_home }}/.ssh/known_hosts"
    name: github.com
    key: "github.com {{ item }}"
    state: present
  loop: "{{ operator_github_metadata.json.ssh_keys }}"
  become: true
  become_user: "{{ operator_user }}"
  when: operator_github_ssh_known_hosts | bool and not ansible_check_mode

- name: Configure SSH for each package repository
  ansible.builtin.include_tasks: git-repository-auth.yml
  loop: "{{ operator_git_ssh_keys }}"
  loop_control:
    loop_var: operator_git_identity
