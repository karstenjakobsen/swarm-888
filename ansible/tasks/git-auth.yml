---
- name: Validate Git identity locations
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-zA-Z0-9_-]+$')
      - item.path is match('^/[a-zA-Z0-9_./-]+$')
      - item.path.startswith(operator_home + '/.ssh/')
      - "'..' not in item.path.split('/')"
      - item.repository_dir is match('^/[a-zA-Z0-9_./-]+$')
      - "'..' not in item.repository_dir.split('/')"
    fail_msg: Use named SSH identities in the controller account's .ssh directory and canonical repository paths.
  loop: "{{ operator_git_ssh_keys }}"

- name: Create the controller SSH directory
  ansible.builtin.file:
    path: "{{ operator_home }}/.ssh"
    state: directory
    owner: "{{ operator_user }}"
    group: "{{ operator_group }}"
    mode: "0700"

- name: Generate missing package repository identities as the controller
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "swarm-888 {{ item.name }}", -f, "{{ item.path }}"]
    creates: "{{ item.path }}"
  become: true
  become_user: "{{ operator_user }}"
  loop: "{{ operator_git_ssh_keys }}"

- name: Keep private identities controller-owned and private
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ operator_user }}"
    group: "{{ operator_group }}"
    mode: "0600"
  loop: "{{ operator_git_ssh_keys }}"
  when: not ansible_check_mode

- name: Read GitHub's published SSH host keys over verified HTTPS
  ansible.builtin.uri:
    url: https://api.github.com/meta
    return_content: true
    status_code: 200
    headers:
      Accept: application/vnd.github+json
  register: operator_github_metadata
  check_mode: false
  when: operator_github_ssh_known_hosts | bool

- name: Trust GitHub's published host keys for controller Git operations
  ansible.builtin.known_hosts:
    path: "{{ operator_home }}/.ssh/known_hosts"
    name: github.com
    key: "github.com {{ item }}"
    state: present
  loop: "{{ operator_github_metadata.json.ssh_keys }}"
  become: true
  become_user: "{{ operator_user }}"
  when: operator_github_ssh_known_hosts | bool and not ansible_check_mode

- name: Configure SSH for each package repository
  ansible.builtin.include_tasks: git-repository-auth.yml
  loop: "{{ operator_git_ssh_keys }}"
  loop_control:
    loop_var: operator_git_identity
