---
- name: Install the Swarm 888 operator and persistent workers
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - vars/defaults.yml
  vars:
    operator_units:
      - name: swarm-888.service
        description: Swarm 888 controller and web UI
        kind: controller
        enabled: true
      - name: swarm-888-worker.service
        description: Swarm 888 default user worker
        kind: user
        enabled: "{{ operator_user_worker_enabled | bool }}"
      - name: swarm-888-root-worker.service
        description: Swarm 888 named root worker
        kind: root
        enabled: "{{ operator_root_worker_enabled | bool }}"
    operator_launch_environment:
      PATH: "{{ operator_runtime_path }}"
      APP_STATE_DIR: "{{ operator_state_dir }}"
      APP_CONTROLLER_UID: "{{ operator_account.uid | string }}"
      APP_PROJECTS_DIR: "{{ operator_projects_dir }}"
      APP_WORKER_ID: ""
      APP_WORKER_MODE: user
      APP_REQUIRE_ROOT_WORKER: "false"

  pre_tasks:
    - name: Validate target and controller identity
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.16', '>=')
          - ansible_facts.os_family == 'Debian'
          - ansible_facts.service_mgr == 'systemd'
          - ansible_facts.architecture in ['x86_64', 'aarch64']
          - operator_user is match('^[a-z_][a-z0-9_-]*$')
          - operator_user != 'root'
          - operator_group is match('^[a-z_][a-z0-9_-]*$')
          - operator_node_version is match('^26\.[0-9]+\.[0-9]+$')
          - operator_node_version is version('26.13.1', '>=')
          - operator_port | int > 0 and operator_port | int < 65536
          - operator_origins | length > 0
        fail_msg: Use Ansible 2.16+, Debian/Ubuntu with systemd, and a normal controller account.

    - name: Validate paths used in environment files and system services
      ansible.builtin.assert:
        that:
          - item is match('^/[a-zA-Z0-9_./-]+$')
          - item != '/'
          - not item.endswith('/')
          - "'..' not in item.split('/')"
          - "'.' not in item.split('/')"
          - "'//' not in item"
        fail_msg: Use absolute canonical paths without whitespace or systemd specifiers.
      loop:
        - "{{ operator_home }}"
        - "{{ operator_checkout }}"
        - "{{ operator_state_dir }}"
        - "{{ operator_projects_dir }}"
        - "{{ operator_node_dir }}"
        - "{{ operator_env_file }}"

    - name: Validate durable state and project locations
      ansible.builtin.assert:
        that:
          - not (operator_state_dir + '/').startswith(operator_checkout + '/')
          - not (operator_checkout + '/').startswith(operator_state_dir + '/')
          - not (operator_projects_dir + '/').startswith(operator_checkout + '/')
          - not (operator_checkout + '/').startswith(operator_projects_dir + '/')
          - not (operator_state_dir + '/').startswith(operator_projects_dir + '/')
          - >-
            not (operator_projects_dir + '/').startswith(operator_state_dir + '/') or
            (operator_projects_dir + '/').startswith(operator_state_dir + '/projects/')
          - not (operator_state_dir + '/').startswith('/tmp/')
          - not (operator_state_dir + '/').startswith('/var/tmp/')
          - not (operator_projects_dir + '/').startswith('/tmp/')
          - not (operator_projects_dir + '/').startswith('/var/tmp/')

    - name: Validate root worker startup settings
      ansible.builtin.assert:
        that:
          - operator_root_worker_id is match('^[a-z0-9][a-z0-9_-]{0,63}$')
          - operator_root_worker_id != 'default'
          - operator_root_worker_model is match('^[a-zA-Z0-9._/-]+$')
          - operator_root_worker_name is match('^[a-zA-Z0-9 _-]{1,120}$')
          - operator_root_worker_effort in ['', 'none', 'minimal', 'low', 'medium', 'high', 'xhigh', 'max', 'ultra']
      when: operator_root_worker_enabled | bool

    - name: Validate private socket path lengths
      ansible.builtin.assert:
        that:
          - not operator_user_worker_enabled | bool or (operator_state_dir + '/worker.sock') | length <= 107
          - >-
            not operator_root_worker_enabled | bool or
            (operator_state_dir + '/workers/' + operator_root_worker_id + '/worker.sock') | length <= 107
        fail_msg: Use a shorter persistent state path or root worker ID for Linux Unix sockets.

    - name: Inspect existing installation
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ operator_checkout }}/package.json"
        - "{{ operator_env_file }}"
        - "{{ operator_node_dir }}/bin/node"
        - "{{ operator_state_dir }}/workers/{{ operator_root_worker_id }}/registration.json"
      register: operator_existing

    - name: Validate a new environment password
      ansible.builtin.assert:
        that:
          - operator_admin_password | length >= 12
          - operator_admin_password != 'CHANGE-ME-to-a-unique-password'
          - "'\n' not in operator_admin_password and '\r' not in operator_admin_password"
          - >-
            "'" not in operator_admin_password or '`' not in operator_admin_password
        fail_msg: Provide a unique password of at least 12 characters, with no newlines and omitting either single quotes or backticks.
      no_log: true
      when: not operator_existing.results[1].stat.exists or operator_replace_env | bool

    - name: Read existing root worker registration
      ansible.builtin.slurp:
        src: "{{ operator_state_dir }}/workers/{{ operator_root_worker_id }}/registration.json"
      register: operator_registration
      no_log: true
      when: operator_root_worker_enabled | bool and operator_existing.results[3].stat.exists

    - name: Keep existing named worker startup settings
      ansible.builtin.assert:
        that:
          - record.id == operator_root_worker_id
          - record.mode == 'root'
          - record.model == operator_root_worker_model
          - (record.effort | default('')) == operator_root_worker_effort
        fail_msg: Existing worker model, effort and mode are pinned. Match its settings or choose a new worker ID.
      vars:
        record: "{{ operator_registration.content | b64decode | from_json }}"
      when: operator_root_worker_enabled | bool and operator_existing.results[3].stat.exists

    - name: Explain incomplete fresh-host check mode
      ansible.builtin.debug:
        msg: Check mode cannot build a missing checkout or runtime. Run setup to provision this host.
      when: ansible_check_mode and (not operator_existing.results[0].stat.exists or not operator_existing.results[2].stat.exists)

    - name: Finish fresh-host check mode before tasks requiring installed files
      ansible.builtin.meta: end_host
      when: ansible_check_mode and (not operator_existing.results[0].stat.exists or not operator_existing.results[2].stat.exists)

  tasks:
    - name: Install host packages
      ansible.builtin.apt:
        name: [acl, ca-certificates, git, libatomic1, xz-utils]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the controller group
      ansible.builtin.group:
        name: "{{ operator_group }}"

    - name: Create the normal controller account
      ansible.builtin.user:
        name: "{{ operator_user }}"
        group: "{{ operator_group }}"
        home: "{{ operator_home }}"
        create_home: true
        shell: /bin/bash
      register: operator_account

    - name: Create private persistent directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ operator_user }}"
        group: "{{ operator_group }}"
        mode: "0700"
      loop:
        - "{{ operator_home }}/.local"
        - "{{ operator_home }}/.local/share"
        - "{{ operator_state_dir }}"
        - "{{ operator_projects_dir }}"

    - name: Create runtime installation directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /var/cache/swarm-888
        - "{{ operator_node_dir }}"
        - /usr/local/lib/swarm-888

    - name: Download the pinned Node archive and verify its official SHA256
      ansible.builtin.get_url:
        url: "https://nodejs.org/dist/v{{ operator_node_version }}/node-v{{ operator_node_version }}-linux-{{ operator_node_arch }}.tar.xz"
        dest: "/var/cache/swarm-888/node-v{{ operator_node_version }}-linux-{{ operator_node_arch }}.tar.xz"
        checksum: "sha256:https://nodejs.org/dist/v{{ operator_node_version }}/SHASUMS256.txt"
        owner: root
        group: root
        mode: "0644"
      when: not operator_existing.results[2].stat.exists

    - name: Install the pinned Node runtime
      ansible.builtin.unarchive:
        src: "/var/cache/swarm-888/node-v{{ operator_node_version }}-linux-{{ operator_node_arch }}.tar.xz"
        dest: "{{ operator_node_dir }}"
        remote_src: true
        extra_opts: [--strip-components=1]
        creates: "{{ operator_node_dir }}/bin/node"
        owner: root
        group: root

    - name: Clone a missing application checkout as the controller user
      ansible.builtin.git:
        repo: "{{ operator_repo_url }}"
        dest: "{{ operator_checkout }}"
        version: "{{ operator_repo_version }}"
        update: false
        force: false
      become: true
      become_user: "{{ operator_user }}"
      when: operator_manage_checkout | bool and not operator_existing.results[0].stat.exists

    - name: Check controller access to the application checkout
      ansible.builtin.stat:
        path: "{{ operator_checkout }}"
      become: true
      become_user: "{{ operator_user }}"
      register: operator_checkout_access

    - name: Require a controller-owned checkout
      ansible.builtin.assert:
        that:
          - operator_checkout_access.stat.isdir | default(false)
          - operator_checkout_access.stat.uid == operator_account.uid
          - operator_checkout_access.stat.writeable | default(false)
        fail_msg: The controller account must own and be able to write its application checkout.

    - name: Install the deployment helpers
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/usr/local/lib/swarm-888/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [source_fingerprint.py, worker-maintenance.mjs]

    - name: Configure, build, and enable services
      ansible.builtin.include_tasks: tasks/deploy.yml
