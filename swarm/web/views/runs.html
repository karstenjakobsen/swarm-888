<section x-show="selectedTab === 'runs'">
  <div class="metrics">
    <div>
      <span>Workers active</span
      ><strong
        ><b x-text="activeCount"></b
        ><small> / <span x-text="capacity"></span></small
      ></strong>
    </div>
    <div><span>Tasks queued</span><strong x-text="queued"></strong></div>
    <div><span>Workspaces</span><strong x-text="workspaces.length"></strong></div>
  </div>
  <form class="panel composer" @submit.prevent="newRun">
    <label for="task">New task</label>
    <textarea
      id="task"
      x-model="prompt"
      maxlength="20000"
      required
      placeholder="What should the operator work on?"
      @keydown.ctrl.enter.prevent="newRun"
    ></textarea>
    <div class="composer-foot">
      <label class="destination"
        >Run on
        <select x-model="target" aria-label="Run on">
          <option value="">This operator</option>
          <template x-for="peer in peers" :key="peer.id"
            ><option :value="peer.id" x-text="peer.name"></option
          ></template></select
      ></label>
      <button class="primary" :disabled="submitDisabled">Queue task</button>
    </div>
  </form>
  <div class="section-head">
    <h2>Run history</h2>
    <span class="muted" x-text="runSummary"></span>
  </div>
  <div class="empty" x-show="emptyRuns">
    <div class="empty-icon" aria-hidden="true">▤</div>
    <h3>No runs yet</h3>
    <p>Queue a task to see its worker, actions, and result here.</p>
  </div>
  <template x-for="job in jobs" :key="job.id"
    ><article class="run">
      <button
        class="run-head"
        @click="inspect(job.id)"
        :aria-expanded="showDetail(job.id)"
      >
        <span :class="stateClass(job.state)" x-text="job.state"></span
        ><strong x-text="jobTitle(job)"></strong
        ><span class="expand" aria-hidden="true">⌄</span>
      </button>
      <div class="run-meta">
        <span x-text="workerLabel(job)"></span
        ><time x-text="when(job.created)"></time
        ><span x-text="job.activity"></span>
      </div>
      <template x-if="showDetail(job.id)"
        ><div class="run-body">
          <h4>Task</h4>
          <p class="wrap" x-text="detail.job.prompt"></p>
          <h4>Activity</h4>
          <p class="muted" x-show="!detail.events.length">
            Waiting for a worker.
          </p>
          <ol class="events">
            <template x-for="(e,i) in detail.events" :key="i"
              ><li>
                <time x-text="when(e.at)"></time
                ><span x-text="e.message"></span></li
            ></template>
          </ol>
          <template x-if="detail.job.result"
            ><div>
              <h4>Result</h4>
              <pre x-text="detail.job.result"></pre></div
          ></template></div
      ></template></article
  ></template>
</section>
