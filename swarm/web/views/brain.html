<template x-if="selectedTab === 'brain'">
  <section x-data="brainBrowser" aria-label="Operator Brain">
    <div class="panel brain-tools">
      <label>SQLite records
        <select @change="choose($event.target.value)">
          <option value="memory">Memory notes</option>
          <option value="jobs">Runs and conversations</option>
          <option value="events">Run events</option>
          <option value="projects">Workspaces and catalog checkout</option>
          <option value="shared_catalog">Catalog configuration</option>
          <option value="peers">Peer operators</option>
          <option value="invites">Invited workspaces</option>
        </select>
      </label>
      <button class="secondary" @click="load" :disabled="pending">Refresh</button>
    </div>
    <div class="section-head">
      <h2 class="mono" x-text="table"></h2>
      <span class="muted">Newest first</span>
    </div>
    <p class="error" role="alert" x-show="problem" x-text="problem"></p>
    <p class="empty" x-show="pending" role="status">Loading records…</p>
    <p class="empty" x-show="!pending && !problem && !rows.length">No records in this table.</p>
    <template x-for="row in rows" :key="row.record">
      <details class="run brain-record" :open="table === 'memory'">
        <summary><strong x-text="title(row)"></strong> <time class="muted" x-text="stamp(row)"></time></summary>
        <dl>
          <template x-for="field in fields(row)" :key="field.name">
            <div><dt x-text="field.name"></dt><dd x-text="field.value"></dd></div>
          </template>
        </dl>
      </details>
    </template>
    <div class="section-head" x-show="nextCursor || cursors.length > 1">
      <button class="secondary" @click="newer" :disabled="pending || cursors.length === 1">Newer</button>
      <button class="secondary" @click="older" :disabled="pending || !nextCursor">Older</button>
    </div>
  </section>
</template>
