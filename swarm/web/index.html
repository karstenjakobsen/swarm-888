<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#142b32" />
    <title>Swarm 888 · Operator</title>
    <link rel="stylesheet" href="/app.css" />
    <script defer src="/api.js"></script>
    <script defer src="/dashboard.js"></script>
    <script defer src="/brain.js"></script>
    <script defer src="/workspaces.js"></script>
    <script defer src="/peers.js"></script>
    <script defer src="/vendor/alpine-csp.js"></script>
  </head>
  <body
    x-data="dashboard"
    @workspace-created.window="selectProject($event.detail.id)"
    @peers-changed.window="refresh"
  >
    <noscript>Enable JavaScript to use the operator dashboard.</noscript>
    <div class="gate" x-show="!authenticated" x-cloak>
      <div class="signin">
        <span class="wordmark">Swarm <b>888</b></span>
        <h1>Open operator</h1>
        <p>
          Use the private access link printed by the server, or enter its
          operator key.
        </p>
        <form @submit.prevent="signIn">
          <label
            >Operator key<input
              type="password"
              required
              x-model="operatorKey"
              autocomplete="off"
          /></label>
          <button class="primary">Open dashboard</button>
        </form>
        <p class="error" x-text="error" x-show="error"></p>
      </div>
    </div>
    <div class="layout" x-show="authenticated" x-cloak>
      <aside class="rail" aria-label="Navigation">
        <div class="brand">
          <span class="mark" aria-hidden="true"
            ><i></i><i></i><i></i><i></i></span
          ><span class="wordmark">Swarm <b>888</b></span>
        </div>
        <div class="rail-group">
          <div class="rail-label">Operator</div>
          <nav>
            <button :class="navClass('runs')" @click="tab('runs')">
              <span aria-hidden="true">▤</span>Run desk
            </button>
            <button :class="navClass('brain')" @click="tab('brain')">
              <span aria-hidden="true">◎</span>Brain
            </button>
            <button :class="navClass('workers')" @click="tab('workers')">
              <span aria-hidden="true">▦</span>Worker pool
            </button>
            <button :class="navClass('catalog')" @click="tab('catalog')">
              <span aria-hidden="true">▧</span>Catalog
            </button>
            <button :class="navClass('peers')" @click="tab('peers')">
              <span aria-hidden="true">⌘</span>Peer operators
            </button>
          </nav>
        </div>
        <div class="rail-group" x-data="workspaceForm">
          <div class="workspace-head">
            <span class="rail-label">Workspaces</span
            ><button
              class="plus"
              @click="openForm"
              title="New workspace"
              aria-label="New workspace"
            >
              +
            </button>
          </div>
          <template x-for="p in workspaces" :key="p.id"
            ><button
              :class="projectClass(p.id)"
              @click="selectProject(p.id)"
              x-text="p.name"
            ></button
          ></template>
          <div
            class="overlay"
            x-show="creating"
            @keydown.escape.window="closeForm"
            x-cloak
          >
            <section
              class="dialog"
              role="dialog"
              aria-modal="true"
              aria-label="New workspace"
            >
              <div class="section-head">
                <h2>New workspace</h2>
                <button class="quiet" @click="closeForm">Close</button>
              </div>
              <form @submit.prevent="save">
                <label
                  >Name<input
                    required
                    maxlength="80"
                    x-model="name"
                    x-ref="name"
                /></label>
                <label
                  >Catalog repository <small>Optional</small
                  ><input
                    type="text"
                    placeholder="git@github.com:owner/catalog.git"
                    x-model="repository"
                /></label>
                <label x-show="repository"
                  >Branch, tag, or commit<input
                    x-model="ref"
                    maxlength="200"
                    placeholder="HEAD"
                /></label>
                <label class="check" x-show="repository"
                  ><input type="checkbox" x-model="autoPublish" />Publish
                  catalog changes after successful local runs</label
                >
                <p class="error" x-show="problem" x-text="problem"></p>
                <button class="primary" :disabled="saving">
                  Create workspace
                </button>
              </form>
            </section>
          </div>
        </div>
        <div class="rail-foot">
          <span class="online"></span><span x-text="operator"></span>
        </div>
      </aside>
      <main>
        <header class="top">
          <span>Operator console</span
          ><span class="top-meta"
            ><span class="online" x-show="connected"></span
            ><span x-text="connected ? 'Connected' : 'Reconnecting'"></span
          ></span>
        </header>
        <div class="page">
          <div class="page-head">
            <h1 x-text="viewTitle"></h1>
            <span class="workspace-tag" x-show="selectedTab === 'runs'" x-text="project.name"></span>
          </div>
          <p role="alert" class="error" x-text="error" x-show="error"></p>
          <!-- operator-views -->
        </div>
      </main>
    </div>
  </body>
</html>
